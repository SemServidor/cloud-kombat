service: sem-servidor-smash-mode

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    LEADERBOARD_TABLE: !Ref LeaderboardTable
    GAME_SECRET: ${param:gameSecret, 'cloud-kombat-s3cr3t-default'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
          Resource:
            - !GetAtt LeaderboardTable.Arn
            - !Sub "${LeaderboardTable.Arn}/index/*"

custom:
  stackName: ${param:stackName, 'sem-servidor-game'}
  domainName: ${param:domainName, ''}
  certificateArn: ${param:certificateArn, ''}

package:
  individually: true
  patterns:
    - '!**'

functions:
  startSession:
    handler: backend/startSession.handler
    package:
      patterns:
        - backend/startSession.js
    events:
      - http:
          path: /session
          method: post
          cors: true
      - http:
          path: /session
          method: options
          cors: true

  submitScore:
    handler: backend/submitScore.handler
    package:
      patterns:
        - backend/submitScore.js
        - node_modules/@aws-sdk/**
    events:
      - http:
          path: /scores
          method: post
          cors: true
      - http:
          path: /scores
          method: options
          cors: true

  getLeaderboard:
    handler: backend/getLeaderboard.handler
    package:
      patterns:
        - backend/getLeaderboard.js
        - node_modules/@aws-sdk/**
    events:
      - http:
          path: /scores
          method: get
          cors: true
      - http:
          path: /scores
          method: options
          cors: true

resources:
  Resources:
    # DynamoDB Table para Leaderboard
    LeaderboardTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.stackName}-leaderboard-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: gameId
            AttributeType: S
          - AttributeName: negScore
            AttributeType: N
          - AttributeName: sessionId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: LeaderboardIndex
            KeySchema:
              - AttributeName: gameId
                KeyType: HASH
              - AttributeName: negScore
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: SessionIndex
            KeySchema:
              - AttributeName: sessionId
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        Tags:
          - Key: Name
            Value: ${self:custom.stackName}-leaderboard-${self:provider.stage}

    # S3 Bucket para armazenar o jogo estático
    WebsiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.stackName}-website-${self:provider.stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        Tags:
          - Key: Name
            Value: ${self:custom.stackName}-website-bucket-${self:provider.stage}

    # Política de bucket para permitir acesso público de leitura
    WebsiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebsiteBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: 's3:GetObject'
              Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"

    # CloudFront Distribution
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
              Id: S3Origin
              S3OriginConfig:
                OriginAccessIdentity: ''
          Enabled: true
          DefaultRootObject: index.html
          HttpVersion: http2
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            TargetOriginId: S3Origin
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
            DefaultTTL: 86400
            MinTTL: 0
            MaxTTL: 31536000
          PriceClass: PriceClass_100
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.certificateArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Aliases:
            - ${self:custom.domainName}

  Outputs:
    WebsiteURL:
      Description: URL do site S3
      Value: !GetAtt WebsiteBucket.WebsiteURL

    CloudFrontURL:
      Description: URL de distribuição do CloudFront
      Value: !Sub "https://${CloudFrontDistribution.DomainName}"

    CustomDomainURL:
      Description: URL personalizado
      Value: !Sub "https://${self:custom.domainName}"
      
    BucketName:
      Description: Nome do bucket S3 para deploy
      Value: !Ref WebsiteBucket
      
    CloudFrontDistributionId:
      Description: ID da distribuição CloudFront para invalidação de cache
      Value: !Ref CloudFrontDistribution

    ApiUrl:
      Description: URL da API do Leaderboard
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"

    LeaderboardTableName:
      Description: Nome da tabela DynamoDB do Leaderboard
      Value: !Ref LeaderboardTable
