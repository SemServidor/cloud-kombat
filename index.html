<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sem Servidor: Smash Mode</title>
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <!-- Overlay fica POR CIMA do jogo, não esconde o container -->
    <div id="rotate-overlay">
        <div class="rotate-content">
            <div class="rotate-icon">📱↻</div>
            <p>Gire o celular para jogar</p>
        </div>
    </div>

    <script>
    (function() {
        var overlay = document.getElementById('rotate-overlay');
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (!isMobile) {
            overlay.style.display = 'none';
            return;
        }
        
        function checkOrientation() {
            var isLandscape = window.innerWidth > window.innerHeight;
            overlay.style.display = isLandscape ? 'none' : 'flex';
        }
        
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', function() {
            setTimeout(checkOrientation, 150);
            setTimeout(checkOrientation, 500);
        });
        
        checkOrientation();
        setTimeout(checkOrientation, 500);
    })();
    </script>

    <script src="game/config.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
