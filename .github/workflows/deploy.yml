name: Deploy Sem Servidor Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install -g serverless@3.x
          npm install

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy with Serverless Framework
        id: deploy
        run: |
          serverless deploy --param="stackName=${{ secrets.STACK_NAME }}" --param="domainName=${{ secrets.DOMAIN_NAME }}" --param="certificateArn=${{ secrets.CERTIFICATE_ARN }}" --stage=${{ secrets.STAGE }} --verbose --region=${{ secrets.AWS_REGION }} 2>&1 | tee deploy-output.txt

      - name: Extract API URL and update config
        run: |
          # Extrair a URL da API do output do deploy
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name sem-servidor-smash-mode-${{ secrets.STAGE }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text --region ${{ secrets.AWS_REGION }})
          
          echo "API URL: $API_URL"
          
          # Atualizar o config.js com a URL da API
          echo "// Configuração do jogo - URL da API gerada automaticamente pelo deploy" > game/config.js
          echo "window.LEADERBOARD_API_URL = '${API_URL}';" >> game/config.js

      - name: Build game
        run: |
          mkdir -p dist
          cp -r index.html main.js game assets styles dist/

      - name: Deploy static assets
        run: |
          aws s3 sync dist/ s3://${{ secrets.STACK_NAME }}-website-${{ secrets.STAGE }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items[0]=='${{ secrets.DOMAIN_NAME }}'].Id" --output text)
          if [ ! -z "$DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
          fi
